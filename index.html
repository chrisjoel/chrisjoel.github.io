  <!-- Favicon: inline SVG (a terminal prompt) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090b'/%3E%3Cpath d='M8 10l7 6-7 6' fill='none' stroke='%2334d399' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 22h8' stroke='%2322d3ee' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Decides BEFORE first paint whether the intro plays (once per session, never with reduced motion). -->
  <script>
    (function () {
      var d = document.documentElement, play = true;
      d.classList.add('js');
      try { if (sessionStorage.getItem('je-intro-seen') === '1') play = false; } catch (e) {}
      try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) play = false; } catch (e) {}
      d.setAttribute('data-intro', play ? 'play' : 'skip');
      // Failsafe: if the main script has not started after 4 s, never leave a visitor stuck on the intro.
      setTimeout(function () {
        if (!window.__portfolioBooted && d.getAttribute('data-intro') === 'play') d.setAttribute('data-intro', 'skip');
        if (document.body) document.body.classList.add('ready');
      }, 4000);
    })();
  </script>

  <!-- Tailwind CSS 4 (browser build), pinned and integrity-checked -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
          integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
          crossorigin="anonymous"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>

  <style>
    /* ---------- Base ---------- */
    :root{
      --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --em:var(--color-emerald-400,#34d399);
      --cy:var(--color-cyan-400,#22d3ee);
      --bg:var(--color-zinc-950,#09090b);
    }
    html{background:var(--bg);color-scheme:dark;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{margin:0;opacity:0}
    body.ready{opacity:1;transition:opacity .25s ease}
    :focus-visible{outline:2px solid var(--em);outline-offset:3px;border-radius:6px}
    main:focus{outline:none}
    ::selection{background:color-mix(in srgb,var(--em) 35%,transparent)}
    .skip-link{position:absolute;left:-9999px;top:8px;z-index:100;padding:.5rem .9rem;border-radius:.5rem;background:var(--em);color:#09090b;font:600 .875rem var(--sans)}
    .skip-link:focus{left:12px}

    /* ---------- Ambient background: grid, scanlines, glows ---------- */
    .ambient{position:fixed;inset:0;z-index:0;pointer-events:none}
    .bg-grid{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 25%,#000 25%,transparent 100%);mask-image:radial-gradient(ellipse 85% 70% at 50% 25%,#000 25%,transparent 100%)}
    .scanlines{background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0,rgba(255,255,255,.022) 1px,transparent 1px,transparent 3px)}
    .glow-a,.glow-b{position:absolute;border-radius:9999px;width:min(70vw,640px);aspect-ratio:1}
    .glow-a{top:-18%;left:-12%;background:radial-gradient(closest-side,color-mix(in srgb,var(--em) 16%,transparent),transparent)}
    .glow-b{bottom:-22%;right:-14%;background:radial-gradient(closest-side,color-mix(in srgb,var(--cy) 14%,transparent),transparent)}
    #site{position:relative;z-index:10}

    /* ---------- Glass cards ---------- */
    .glass{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:1rem;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

    /* ---------- Buttons and chips ---------- */
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.15rem;border-radius:.75rem;font:600 .9rem/1 var(--sans);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease}
    .btn svg{width:1rem;height:1rem;transition:transform .2s ease}
    .btn:hover svg{transform:translateX(3px)}
    .btn-primary{background:linear-gradient(135deg,var(--em),var(--cy));color:#09090b}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px -8px color-mix(in srgb,var(--em) 60%,transparent)}
    .btn-ghost{color:#e4e4e7;border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.03)}
    .btn-ghost:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
    .chip{font:500 .8rem/1 var(--sans);padding:.5rem .9rem;border-radius:9999px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#d4d4d8;cursor:pointer;transition:background-color .2s ease,border-color .2s ease,color .2s ease}
    .chip:hover{border-color:var(--em);color:#fff}
    .chip[aria-pressed="true"]{background:var(--em);border-color:var(--em);color:#09090b}
    .pill{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .8rem;border-radius:9999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font:500 .78rem/1.2 var(--mono);color:#d4d4d8}
    .dot{width:.5rem;height:.5rem;border-radius:9999px;background:var(--em);box-shadow:0 0 10px var(--em);animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    @keyframes blink{50%{opacity:0}}

    /* ---------- Stack tiles ---------- */
    .tiles{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;margin:0;padding:0}
    .tile{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .65rem .4rem .45rem;border-radius:.65rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);font:500 .78rem/1 var(--mono);color:#e4e4e7}
    .tile img,.tile .ico{width:1.35rem;height:1.35rem;flex:none;border-radius:.35rem;background:#fff;padding:2px;object-fit:contain}
    .tile .ico{color:#065f46;display:block}
    .tick{width:.95rem;height:.95rem;flex:none;color:var(--em)}

    /* ---------- Language switch, menu ---------- */
    .lang{display:inline-flex;border:1px solid rgba(255,255,255,.14);border-radius:9999px;padding:2px;background:rgba(255,255,255,.04)}
    .lang button{font:600 .75rem/1 var(--mono);padding:.4rem .65rem;border-radius:9999px;border:0;background:transparent;color:#d4d4d8;cursor:pointer}
    .lang button[aria-pressed="true"]{background:var(--em);color:#09090b}
    .navlink{color:#d4d4d8;text-decoration:none;font:500 .875rem var(--sans);padding:.35rem 0;border-bottom:2px solid transparent;transition:color .2s ease,border-color .2s ease}
    .navlink:hover{color:#fff;border-color:var(--em)}

    /* ---------- Skill cards ---------- */
    .skillcard{padding:1.25rem}
    .skillcard h3{margin:0 0 .85rem;font:600 .8rem/1.2 var(--mono);color:var(--cy)}

    /* ---------- Project cards ---------- */
    .pgrid{display:grid;gap:1rem;grid-template-columns:1fr}
    .pcard{display:flex;flex-direction:column;gap:.5rem;padding:1.4rem;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
    .pcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--em) 55%,transparent);box-shadow:0 16px 40px -18px color-mix(in srgb,var(--em) 45%,transparent)}
    .pcard h3{margin:0;font:700 1.05rem/1.3 var(--mono);color:#fafafa}
    .pcard p{margin:0;color:#a1a1aa;font-size:.92rem;line-height:1.6}
    .plogos{display:flex;gap:.4rem;min-height:1.9rem;margin-bottom:.25rem}
    .plogos img{width:1.9rem;height:1.9rem;padding:3px;border-radius:.45rem;background:#fff;object-fit:contain}
    .pfacts{display:flex;flex-wrap:wrap;gap:.25rem .9rem;font:500 .78rem/1.4 var(--mono);color:#a1a1aa}
    .plinks{margin-top:auto;display:flex;flex-wrap:wrap;gap:.6rem;padding-top:.9rem}
    .plinks .btn{padding:.55rem .9rem;font-size:.82rem}
    .soon{margin-top:auto;padding-top:.9rem;font-size:.85rem;color:#a1a1aa}
    .syncnote{margin:1.5rem 0 0;font-size:.8rem;color:#a1a1aa}

    /* ---------- Experience ---------- */
    .jobs{list-style:none;margin:0;padding:0;display:grid;gap:1.25rem}
    .job{padding:1.4rem}
    .job h3{margin:0;font:700 1.05rem/1.35 var(--mono);color:#fafafa}
    .job .co{margin:.15rem 0 0;color:var(--em);font:600 .9rem var(--sans)}
    .job .meta{margin:.15rem 0 .8rem;color:#a1a1aa;font:500 .8rem/1.5 var(--mono)}
    .job ul{margin:0;padding-left:1.1rem;display:grid;gap:.4rem;color:#d4d4d8;font-size:.92rem;line-height:1.6}
    .job li::marker{color:var(--em)}
    .edu{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
    .edu strong{display:block;color:#fafafa;font:600 .92rem/1.4 var(--sans)}
    .edu span{display:block;color:#a1a1aa;font-size:.85rem;line-height:1.5}

    /* ---------- Certifications ---------- */
    .certs-panel{padding:1.5rem;border-radius:1.5rem;background:radial-gradient(60% 80% at 10% 10%,color-mix(in srgb,var(--em) 22%,transparent),transparent 62%),radial-gradient(60% 80% at 95% 95%,color-mix(in srgb,var(--cy) 20%,transparent),transparent 62%),rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09)}
    .cgrid{display:grid;gap:.85rem;grid-template-columns:repeat(2,1fr)}
    .ccard{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;padding:1.1rem .8rem;border-radius:1rem;border:1px solid rgba(255,255,255,.1);background:rgba(9,9,11,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#f4f4f5;cursor:pointer;font:inherit;transition:transform .25s ease,border-color .25s ease,background-color .25s ease}
    .ccard:hover{transform:translateY(-4px);border-color:var(--em);background:rgba(9,9,11,.65)}
    .ccard strong{font:600 .85rem/1.35 var(--sans)}
    .ccard .issuer{font-size:.75rem;color:#a1a1aa}
    .cmark{display:grid;place-items:center;width:4rem;height:4rem;flex:none}
    .cmark img{width:100%;height:100%;object-fit:contain}
    .cmark.logo{background:#fff;border-radius:.9rem;padding:.7rem}
    dialog.cdialog{margin:auto;border:1px solid rgba(255,255,255,.14);border-radius:1.25rem;padding:0;max-width:30rem;width:calc(100% - 2rem);background:#111114;color:#e4e4e7;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
    dialog.cdialog::backdrop{background:rgba(3,7,10,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
    html:has(dialog[open]){overflow:hidden}
    .dlg{position:relative;padding:1.75rem 1.5rem 1.5rem}
    .dlg h3{margin:.9rem 0 .15rem;font:700 1.15rem/1.35 var(--mono);color:#fafafa}
    .dlg .by{margin:0;color:#a1a1aa;font-size:.9rem}
    .dlg dl{display:grid;gap:.9rem;margin:1.1rem 0}
    .dlg dt{font:500 .75rem/1.2 var(--mono);color:#a1a1aa}
    .dlg dd{margin:.2rem 0 0;font-weight:600;word-break:break-all}
    .dlg .desc{margin:0 0 1rem;color:#d4d4d8;font-size:.92rem;line-height:1.6}
    .dlg .xbtn{position:absolute;top:.7rem;right:.8rem;width:2.2rem;height:2.2rem;display:grid;place-items:center;border:0;border-radius:9999px;background:rgba(255,255,255,.06);color:#e4e4e7;cursor:pointer}
    .dlg .xbtn:hover{background:rgba(255,255,255,.14)}
    .dlg .xbtn svg{width:1.1rem;height:1.1rem}
    .dlg .tiles{margin-bottom:1.1rem}

    /* ---------- Contact ---------- */
    .social{display:flex;flex-wrap:wrap;gap:.9rem;margin:1.5rem 0}
    .social a{display:flex;flex-direction:column;align-items:center;gap:.6rem;width:7rem;padding:1.1rem 0;border-radius:1rem;color:#f4f4f5;text-decoration:none;font:600 .85rem var(--sans);transition:transform .2s ease,border-color .2s ease}
    .social a:hover{transform:translateY(-4px);border-color:var(--em)}
    .social .mark{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.7rem;background:#fff;color:#065f46}
    .social .mark img{width:1.6rem;height:1.6rem}
    .social .mark svg{width:1.5rem;height:1.5rem}

    /* ---------- Hero stats ---------- */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;max-width:34rem;margin:2.5rem 0 0}
    .stats>div{display:flex;flex-direction:column-reverse;gap:.15rem;padding:.9rem 1rem;border-radius:.9rem;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04)}
    .stats dd{margin:0;font:700 1.6rem/1.1 var(--mono);color:var(--em);font-variant-numeric:tabular-nums}
    .stats dt{font-size:.75rem;line-height:1.35;color:#a1a1aa}

    /* ---------- Scroll reveals (only when JS runs) ---------- */
    .js .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
    .js .reveal.in{opacity:1;transform:none}

    /* ---------- Intro ---------- */
    #intro{position:fixed;inset:0;z-index:50;display:none;overflow:hidden}
    html[data-intro="play"] #intro{display:block}
    html[data-intro="play"]{overflow:hidden}
    html[data-intro="play"] #site{visibility:hidden}
    #skip{position:absolute;top:max(1rem,env(safe-area-inset-top));right:max(1rem,env(safe-area-inset-right));z-index:5;display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-radius:9999px;border:1px solid rgba(255,255,255,.2);background:rgba(9,9,11,.7);color:#f4f4f5;font:600 .8rem/1 var(--mono);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
    #skip:hover{background:rgba(255,255,255,.12)}
    #skip svg{width:.9rem;height:.9rem}
    .scene{position:absolute;inset:0;display:flex;overflow-y:auto;padding:4.5rem 1rem 1.5rem;opacity:0;visibility:hidden}
    .scene>*{margin:auto;width:100%}
    html[data-intro="play"] .scene{will-change:opacity,transform}

    /* scene 1: terminal */
    #term{max-width:42rem;border-radius:1rem;border:1px solid rgba(255,255,255,.12);background:rgba(24,24,27,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 0 70px -20px color-mix(in srgb,var(--em) 45%,transparent);opacity:0}
    .term-bar{display:flex;align-items:center;gap:.4rem;padding:.7rem .9rem;border-bottom:1px solid rgba(255,255,255,.09)}
    .term-bar i{width:.65rem;height:.65rem;border-radius:9999px;background:#3f3f46}
    .term-bar span{margin-left:.6rem;font:500 .75rem var(--mono);color:#a1a1aa}
    .term-body{padding:1rem 1.1rem 1.1rem;font:400 .75rem/1.55rem var(--mono);color:#d4d4d8}
    .cmd{margin:0;color:#fafafa;word-break:break-all}
    .cmd .pr{color:var(--em);margin-right:.5rem}
    .ch{opacity:0;white-space:pre}
    .caret{display:inline-block;width:.55em;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--em);animation:blink 1s steps(1) infinite}
    #logview{position:relative;margin-top:.6rem;height:11rem;overflow:hidden}
    #loglist{list-style:none;margin:0;padding:0 0 .6rem}
    .logline{opacity:0;word-break:break-word}
    .logline.ok{color:var(--em)}.logline.info{color:var(--cy)}.logline.dim{color:#a1a1aa}
    .logline.done{color:var(--em);font-weight:700;text-shadow:0 0 18px color-mix(in srgb,var(--em) 80%,transparent)}
    @media (min-width:640px){.term-body{font-size:.875rem}#logview{height:13rem}}

    /* scene 2: identity */
    #sc2 .wrap{position:relative;text-align:center;max-width:56rem}
    #id-glow{position:absolute;left:50%;top:38%;width:min(90vw,560px);aspect-ratio:2/1;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--cy) 38%,transparent),transparent);opacity:0;pointer-events:none}
    #id-name{position:relative;margin:0;font:700 clamp(2.1rem,9vw,5.2rem)/1.1 var(--mono);color:#fafafa;letter-spacing:-.02em;text-shadow:0 0 28px color-mix(in srgb,var(--cy) 45%,transparent)}
    .letter{display:inline-block;opacity:0}
    #id-role{position:relative;margin:1rem 0 0;font:500 clamp(.9rem,3.4vw,1.4rem) var(--mono);color:var(--em);opacity:0}
    #id-tagwrap{position:relative;display:inline-block;margin:1.6rem 0 0;font:500 clamp(1.05rem,4.4vw,1.9rem)/1.3 var(--sans);color:#e4e4e7;opacity:0}
    #id-underline{position:absolute;left:0;bottom:-6px;height:2px;width:100%;background:linear-gradient(90deg,var(--em),var(--cy));transform:scaleX(0);transform-origin:left}

    /* scene 3: pipeline */
    #pl-head{display:flex;justify-content:space-between;gap:1rem;margin-bottom:1rem;font:500 .75rem/1.2 var(--mono);color:#a1a1aa;opacity:0}
    #pl-state{position:relative;display:inline-block;min-width:5rem;text-align:right}
    #pl-state span{display:inline-block}
    #pl-ok{position:absolute;right:0;top:0;color:var(--em);opacity:0}
    #pl-run{color:var(--cy)}
    #pipeline{position:relative;display:grid;gap:.75rem;list-style:none;margin:0;padding:0}
    .stage{position:relative;display:flex;gap:.75rem;opacity:0}
    .node{position:relative;z-index:1;display:grid;place-items:center;flex:none;width:2rem;height:2rem;border-radius:9999px;border:1px solid rgba(255,255,255,.18);background:#18181b;font:600 .75rem var(--mono);color:#a1a1aa}
    .node-ok{position:absolute;inset:-1px;display:grid;place-items:center;border-radius:inherit;border:1px solid var(--em);background:color-mix(in srgb,var(--em) 18%,#18181b);color:var(--em);opacity:0}
    .node-ok svg{width:.95rem;height:.95rem}
    .conn{position:absolute;left:15px;top:32px;bottom:-12px;width:2px;background:rgba(255,255,255,.1)}
    .stage:last-child .conn{display:none}
    .fill{position:absolute;inset:0;background:linear-gradient(to bottom,var(--em),var(--cy));transform:scaleY(0);transform-origin:50% 0}
    .scard{flex:1;min-width:0;padding:.7rem .8rem;border-radius:.85rem;border:1px solid rgba(255,255,255,.1);background:rgba(24,24,27,.6)}
    .scard h3{margin:0 0 .5rem;font:600 .75rem/1.2 var(--mono);color:#e4e4e7}
    #pipeline .tile,#pipeline .tick{opacity:0}
    #pipeline .tile{padding:.3rem .5rem .3rem .35rem;font-size:.72rem}
    #pipeline .tile img,#pipeline .tile .ico{width:1.15rem;height:1.15rem}
    #stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.1rem}

        return { title: p.title, text: (p.description && (p.description[lang] || p.description.en)) || (r && r.description) || '',
          logos: p.logos.length ? p.logos : d.logos, cats: p.cats.length ? p.cats : d.cats, href: safeUrl(p.link),
          demo: r ? r.homepage : '', language: r ? r.language : '', stars: r ? r.stars : 0, updated: r ? fmtDate(r.pushedAt) : '' };
      });
      const added = ((synced && synced.repos) || []).filter((r) => !matched.has(r.name.toLowerCase())).map((r) => {
        const d = fromTopics(r.topics, r.language);
        return { title: titleFrom(r.name), text: r.description || '', logos: d.logos, cats: d.cats, href: r.url,
          demo: r.homepage, language: r.language, stars: r.stars, updated: fmtDate(r.pushedAt) };
      });
      return curated.concat(added);
    }
    function renderProjects() {
      const list = buildProjects();
      const present = new Set(list.flatMap((p) => p.cats));
      const order = CONFIG.SYNC.CATEGORY_ORDER;
      const cats = order.filter((c) => present.has(c)).concat([...present].filter((c) => !order.includes(c)).sort());
      if (projFilter !== 'All' && !cats.includes(projFilter)) projFilter = 'All';
      const filters = $('#proj-filters');
      filters.replaceChildren(...['All'].concat(cats).map((c) => h('button', {
        type: 'button', class: 'chip', 'aria-pressed': String(c === projFilter), text: c === 'All' ? t('projects.all') : c,
        'data-cat': c })));
      $$('.chip', filters).forEach((b) => b.addEventListener('click', () => { projFilter = b.getAttribute('data-cat'); renderProjects(); }));
      const shown = list.filter((p) => projFilter === 'All' || p.cats.includes(projFilter));
      $('#proj-grid').replaceChildren(...shown.map((p) => {
        const facts = [];
        if (p.language) facts.push(h('span', { text: p.language }));
        if (p.updated) facts.push(h('span', { text: t('projects.updated') + ' ' + p.updated }));
        if (p.stars > 0) facts.push(h('span', { text: '★ ' + p.stars }));
        let links;
        if (p.href) {
          const gh = h('a', { class: 'btn btn-primary', href: p.href, target: '_blank', rel: 'noopener noreferrer' }, h('span', { text: t('projects.view') }), icon('arrow'));
          links = h('div', { class: 'plinks' }, gh, p.demo && h('a', { class: 'btn btn-ghost', href: p.demo, target: '_blank', rel: 'noopener noreferrer' }, h('span', { text: t('projects.demo') }), icon('arrow')));
        } else links = h('p', { class: 'soon', text: t('projects.soon') });
        return h('article', { class: 'glass pcard' },
          h('div', { class: 'plogos' }, p.logos.filter(safeFile).map((l) => h('img', { src: 'assets/logos/' + safeFile(l) + '.svg', alt: l, width: 30, height: 30, loading: 'lazy', decoding: 'async' }))),
          h('h3', { text: p.title }), h('p', { text: p.text }), facts.length && h('p', { class: 'pfacts' }, facts), links);
      }));
      const note = $('#sync-note');
      if (synced && synced.generatedAt && synced.repos.length) {
        note.textContent = t('projects.synced').replace('{date}', fmtDate(synced.generatedAt, { day: 'numeric', month: 'short' })); note.hidden = false;
      } else note.hidden = true;
    }
    async function loadSynced() {
      try {
        const res = await fetch(CONFIG.SYNC.FILE, { cache: 'no-cache' });
        if (!res.ok) return;
        const clean = sanitizeSync(await res.json());
        if (clean) { synced = clean; renderProjects(); }
      } catch (e) { /* offline or file missing: the CONFIG projects stay as they are */ }
    }

    /* ---------- Experience and education ---------- */
    function span(job) {
      const end = job.end ? fmtDate(job.end) : t('exp.present');
      return fmtDate(job.start) + ' – ' + end;
    }
    function renderExperience() {
      $('#exp-list').replaceChildren(...CONFIG.EXPERIENCE.map((job) => h('li', { class: 'glass job reveal' },
        h('h3', { text: job.role[lang] || job.role.en }), h('p', { class: 'co', text: job.company }),
        h('p', { class: 'meta', text: span(job) + '. ' + (job.place[lang] || job.place.en) }),
        h('ul', {}, (job.bullets[lang] || job.bullets.en).map((b) => h('li', { text: b }))))));
      $('#edu-list').replaceChildren(...CONFIG.EDUCATION.map((e) => h('li', {},
        h('strong', { text: e.name[lang] || e.name.en }), h('span', { text: e.school }), h('span', { text: span(e) }))));
    }

    /* ---------- Certifications (cards + modal) ---------- */
    const dlg = (function () {
      const d = h('dialog', { class: 'cdialog', 'aria-labelledby': 'cert-title' });
      document.body.append(d);
      d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
      return d;
    })();
    let lastTrigger = null;
    dlg.addEventListener('close', () => { if (lastTrigger) lastTrigger.focus(); });
    const certImg = (c) => c.badge && safeFile(c.badge) ? 'assets/badges/' + safeFile(c.badge) : 'assets/logos/' + safeFile(c.logo) + '.svg';
    function mark(c) { return h('span', { class: 'cmark' + (c.badge ? '' : ' logo') }, h('img', { src: certImg(c), alt: '', width: 64, height: 64, loading: 'lazy', decoding: 'async' })); }
    function openCert(c, trigger) {
      lastTrigger = trigger;
      const close = h('button', { type: 'button', class: 'xbtn', 'aria-label': t('certs.close') }); close.append(icon('close'));
      close.addEventListener('click', () => dlg.close());
      const rows = [];
      if (c.issued) rows.push(h('div', {}, h('dt', { text: t('certs.issued') }), h('dd', { text: fmtDate(c.issued, { month: 'long' }) })));
      if (c.credentialId) rows.push(h('div', {}, h('dt', { text: t('certs.id') }), h('dd', { class: 'font-mono text-sm', text: c.credentialId })));
      const url = safeUrl(c.url);
      dlg.replaceChildren(h('div', { class: 'dlg' }, close, mark(c),
        h('h3', { id: 'cert-title', text: c.name }), h('p', { class: 'by', text: c.issuer }),
        rows.length && h('dl', {}, rows),
        c.description && h('p', { class: 'desc', text: c.description[lang] || c.description.en }),
        c.skills && c.skills.length && h('ul', { class: 'tiles', 'aria-label': t('certs.skills') }, c.skills.map((s) => h('li', { class: 'tile' }, h('span', { text: s })))),
        url && h('a', { class: 'btn btn-primary', href: url, target: '_blank', rel: 'noopener noreferrer' }, h('span', { text: t('certs.verify') }), icon('arrow'))));
      dlg.showModal();
    }
    function renderCerts() {
      $('#cert-grid').replaceChildren(...CONFIG.CERTIFICATIONS.map((c) => {
        const b = h('button', { type: 'button', class: 'ccard', 'aria-haspopup': 'dialog' }, mark(c), h('strong', { text: c.name }), h('span', { class: 'issuer', text: c.issuer }));
        b.addEventListener('click', () => openCert(c, b));
        return b;
      }));
      if (dlg.open) dlg.close();
    }

    /* ---------- Contact ---------- */
    function renderContact() {
      const mailto = 'mailto:' + CONFIG.EMAIL;
      const mk = (href, label, markNode, ext) => h('a', { class: 'glass', href, target: ext ? '_blank' : null, rel: ext ? 'noopener noreferrer' : null, 'aria-label': label },
        h('span', { class: 'mark' }, markNode), h('span', { text: label }));
      $('#social').replaceChildren(
        mk(safeUrl(CONFIG.GITHUB), t('contact.github'), h('img', { src: 'assets/logos/github.svg', alt: '', width: 26, height: 26 }), true),
        mk(mailto, t('contact.email'), icon('mail'), false),
        mk(safeUrl(CONFIG.LINKEDIN), t('contact.linkedin'), h('img', { src: 'assets/logos/linkedin.svg', alt: '', width: 26, height: 26 }), true));
      const em = $('#email-text'); em.setAttribute('href', mailto); em.textContent = CONFIG.EMAIL;
    }

    function renderAll() {
      applyStatic(); renderHeroStats(); renderSkills(); renderProjects(); renderExperience(); renderCerts(); renderContact();
      $('#replay').hidden = reducedMq.matches || !window.gsap;
      observeReveals();
    }

    /* ---------- Scroll reveals ---------- */
    let io = null, revealsOn = false;
    function observeReveals() {
      if (!revealsOn) return;
      const items = $$('.reveal:not(.in)');
      if (reducedMq.matches || !('IntersectionObserver' in window)) { items.forEach((n) => n.classList.add('in')); return; }
      if (!io) io = new IntersectionObserver((entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
      items.forEach((n) => io.observe(n));
    }

    /* ---------- Language toggle, menu ---------- */
    $$('.lang button').forEach((b) => b.addEventListener('click', () => {
      const next = b.getAttribute('data-lang'); if (next === lang) return;
      lang = next; storeSet('je-lang', lang); renderAll();
      if (root.getAttribute('data-intro') === 'play') buildIntroDom();
    }));
    const menuBtn = $('#menu-btn'), mobileNav = $('#mobile-nav');
    function setMenu(open) {
      menuBtn.setAttribute('aria-expanded', String(open)); mobileNav.hidden = !open;
      menuBtn.replaceChildren(icon(open ? 'close' : 'menu', 'size-5'));
    }
    menuBtn.addEventListener('click', () => setMenu(menuBtn.getAttribute('aria-expanded') !== 'true'));
    mobileNav.addEventListener('click', (e) => { if (e.target.closest('a')) setMenu(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !mobileNav.hidden) { setMenu(false); menuBtn.focus(); } });

    /* ====================================================================
       INTRO: one GSAP timeline, transform and opacity only (counters change text).
       ==================================================================== */
    let tl = null;
    const markSeen = () => { try { sessionStorage.setItem('je-intro-seen', '1'); } catch (e) {} };

    function buildIntroDom() {
      // scene 1
      $('#cmd-text').replaceChildren(...Array.from(CONFIG.INTRO.command).map((c) => h('span', { class: 'ch', text: c })));
      $('#loglist').replaceChildren(...CONFIG.INTRO.logs.map((l) => h('li', { class: 'logline ' + (l.tone || 'plain'), text: l.text })));
      // scene 2
      const name = $('#id-name'); name.setAttribute('aria-label', CONFIG.NAME);
      name.replaceChildren(...Array.from(CONFIG.NAME).map((c) => h('span', { class: 'letter', 'aria-hidden': 'true', text: c === ' ' ? ' ' : c })));
      $('#id-role').textContent = t('hero.role'); $('#id-tag').textContent = t('hero.tagline');
      // scene 3
      $('#pipeline').replaceChildren(...CONFIG.SKILLS.map((cat, i) => h('li', { class: 'stage' },
        h('span', { class: 'node' }, h('span', { class: 'node-num', text: String(i + 1) }), h('span', { class: 'node-ok' }, icon('check'))),
        h('span', { class: 'conn', 'aria-hidden': 'true' }, h('span', { class: 'fill' })),
        h('div', { class: 'scard' }, h('h3', { text: t('skills.' + cat.key) }), h('ul', { class: 'tiles' }, cat.items.map((it) => tile(it, true)))))));
      $('#stats-row').replaceChildren(...CONFIG.STATS.map((s) => h('div', { class: 'stat' },
        h('p', { class: 'num' }, h('span', { class: 'count', 'data-to': String(s.value), text: '0' }), h('span', { text: s.suffix })),
        h('p', { class: 'lab', text: t(s.labelKey) }))));
    }
    const INTRO_TARGETS = '.scene,#term,#caret,.ch,#loglist,.logline,#id-glow,.letter,#id-role,#id-tagwrap,#id-underline,#pl-head,#pl-run,#pl-ok,.stage,#pipeline .tile,#pipeline .tick,.node-num,.node-ok,.fill,#stats-row .stat,.hero-item,#intro,#site';

    function buildTimeline() {
      const horizontal = window.matchMedia('(min-width: 768px)').matches;
      const timeline = gsap.timeline({ defaults: { ease: 'power2.out' }, onComplete: cleanupIntro });

      /* Scene 1 (0 - 3 s): terminal boot */
      const view = $('#logview'), list = $('#loglist');
      const shift = Math.max(0, list.scrollHeight - view.clientHeight);
      const chars = $$('#cmd-text .ch'), lines = $$('.logline');
      timeline.set('#sc1', { autoAlpha: 1 }, 0)
        .fromTo('#term', { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4 }, 0)
        .to(chars, { autoAlpha: 1, duration: 0.01, stagger: 0.03 }, 0.4);
      const logStart = 0.4 + chars.length * 0.03 + 0.15;           // after the command is typed
      const logStep = Math.min(0.13, (2.75 - logStart - 0.2) / lines.length);
      lines.forEach((l, i) => {
        const last = i === lines.length - 1;
        timeline.fromTo(l, last ? { autoAlpha: 0, scale: 0.96, y: 6 } : { autoAlpha: 0, y: 6 },
          last ? { autoAlpha: 1, scale: 1, y: 0, duration: 0.3, ease: 'back.out(2)' } : { autoAlpha: 1, y: 0, duration: 0.18 }, logStart + i * logStep);
      });
      timeline.to(list, { y: -shift, duration: logStep * lines.length, ease: 'none' }, logStart)
        .to('#sc1', { autoAlpha: 0, y: -10, duration: 0.4 }, 2.8);

      /* Scene 2 (3 - 6 s): identity */
      const letters = $$('.letter');
      timeline.set('#sc2', { autoAlpha: 1 }, 3.0)
        .fromTo('#id-glow', { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 0.9, scale: 1.08, duration: 0.9, ease: 'sine.inOut' }, 3.05)
        .to('#id-glow', { autoAlpha: 0.35, scale: 1, duration: 1.1, ease: 'sine.inOut' }, 3.95)
        .fromTo(letters, { y: 34, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: 'back.out(1.7)', stagger: 0.055 }, 3.1)
        .fromTo('#id-role', { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5 }, 4.15)
        .fromTo('#id-tagwrap', { y: 14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6 }, 4.75)
        .to('#id-underline', { scaleX: 1, duration: 0.75, ease: 'power3.inOut' }, 5.1)
        .to('#sc2', { autoAlpha: 0, y: -12, duration: 0.4 }, 5.7);

      /* Scene 3 (6 - 12 s): the stack as a pipeline, then the stats */
      timeline.set('#sc3', { autoAlpha: 1 }, 6.0)
        .fromTo('#pl-head', { y: 10, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35 }, 6.0);
      const stages = $$('#pipeline .stage');
      let lastPass = 0;
      stages.forEach((st, i) => {
        const t0 = 6.2 + i * 0.85;
        const tiles = $$('.tile', st), ticks = $$('.tick', st);
        const tPass = t0 + 0.5 + 0.12 * (ticks.length - 1) + 0.2;
        timeline.fromTo(st, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35 }, t0)
          .fromTo(tiles, { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.38, ease: 'back.out(1.8)', stagger: 0.08 }, t0 + 0.12)
          .fromTo(ticks, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: 'back.out(2.5)', stagger: 0.12 }, t0 + 0.5)
          .to($('.node-ok', st), { autoAlpha: 1, duration: 0.2 }, tPass)
          .to($('.node-num', st), { autoAlpha: 0, duration: 0.1 }, tPass)
          .fromTo($('.fill', st), horizontal ? { scaleX: 0, scaleY: 1 } : { scaleX: 1, scaleY: 0 },
            horizontal ? { scaleX: 1, duration: 0.45, ease: 'power1.inOut' } : { scaleY: 1, duration: 0.45, ease: 'power1.inOut' }, tPass);
        lastPass = tPass;
      });
      timeline.to('#pl-run', { autoAlpha: 0, duration: 0.15 }, lastPass + 0.1)
        .fromTo('#pl-ok', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, lastPass + 0.2);
      const tStats = lastPass + 0.15;
      timeline.fromTo('#stats-row .stat', { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, stagger: 0.1 }, tStats);
      $$('#stats-row .stat').forEach((stat, i) => {
        const el = $('.count', stat), to = Number(el.getAttribute('data-to')), o = { v: 0 };
        timeline.to(o, { v: to, duration: 1.0, ease: 'power2.out', onUpdate: () => { el.textContent = String(Math.round(o.v)); } }, tStats + 0.1 + i * 0.12);
      });

      /* Scene 4 (12 s+): transition to the landing page */
      timeline.to('#sc3', { autoAlpha: 0, scale: 1.04, duration: 0.5, ease: 'power2.in' }, 12.0)
        .fromTo('#site', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45, ease: 'power1.out' }, 12.3)
        .fromTo('.hero-item', { y: 18, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, stagger: 0.07 }, 12.35);
      return timeline;
    }

    function startIntro() {
      root.setAttribute('data-intro', 'play');
      window.scrollTo(0, 0);
      gsap.set(INTRO_TARGETS, { clearProps: 'all' });
      buildIntroDom();
      gsap.set('#site', { autoAlpha: 0 });
      tl = buildTimeline();
    }
    function cleanupIntro() {
      if (root.getAttribute('data-intro') === 'done') return;
      root.setAttribute('data-intro', 'done');
      gsap.set(INTRO_TARGETS, { clearProps: 'all' });
      markSeen(); revealsOn = true; observeReveals();
      const main = $('#main'); if (main) main.focus({ preventScroll: true });
    }
    function skipIntro() {
      if (!tl || root.getAttribute('data-intro') !== 'play') return;
      tl.kill(); tl = null;
      gsap.to('#intro', { autoAlpha: 0, duration: 0.3, ease: 'power1.out' });
      gsap.fromTo('#site', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, delay: 0.1, onComplete: cleanupIntro });
    }
    $('#skip').addEventListener('click', skipIntro);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') skipIntro(); });
    $('#replay').addEventListener('click', () => {
      if (reducedMq.matches || !window.gsap) return;
      if (tl) { tl.kill(); tl = null; }
      revealsOn = true;
      startIntro();
    });

    /* ---------- Boot ---------- */
    function whenReady(maxWait, fn) {
      const go = () => requestAnimationFrame(() => requestAnimationFrame(fn));
      if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, maxWait))]).then(go); else go();
    }
    renderAll();
    loadSynced();
    const play = root.getAttribute('data-intro') === 'play' && !!window.gsap && !reducedMq.matches;
    if (play) {
      buildIntroDom();
      gsap.set('#site', { autoAlpha: 0 });
      whenReady(700, () => { document.body.classList.add('ready'); startIntro(); });
    } else {
      root.setAttribute('data-intro', 'skip');
      revealsOn = true; observeReveals();
      whenReady(1200, () => document.body.classList.add('ready'));
    }
  })();
  </script>
</body>
</html>
